    let currentSlideIndex = 0;
    let autoSyncEnabled = true;
    let ytPlayer = null;
    let timeTrackingInterval = null;

    // Dynamically build timeline chapter badges
    function initChapterNav() {
      const nav = document.getElementById('chapter-nav');
      nav.innerHTML = '';
      slides.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.id = `nav-pill-${idx}`;
        btn.className = `px-2 py-1 text-[11px] font-semibold rounded transition ${idx === 0 ? 'bg-amber-500 text-slate-950 font-bold' : 'text-gray-400 hover:text-amber-200'}`;
        btn.innerText = s.name;
        btn.onclick = () => {
          goToSlide(idx);
          jumpVideoToSeconds(s.startTime);
        };
        nav.appendChild(btn);
      });
      document.getElementById('total-slides-num').innerText = slides.length;
    }

    // YouTube API callback
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        startTimeTracking();
      } else {
        stopTimeTracking();
      }
    }

    function startTimeTracking() {
      stopTimeTracking();
      timeTrackingInterval = setInterval(() => {
        if (!ytPlayer || !ytPlayer.getCurrentTime) return;
        const currentSec = Math.floor(ytPlayer.getCurrentTime());
        
        // Update digital clock readout
        const mins = Math.floor(currentSec / 60);
        const secs = currentSec % 60;
        document.getElementById('video-time-clock').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

        // Auto-advance matching slide
        if (autoSyncEnabled) {
          for (let i = slides.length - 1; i >= 0; i--) {
            if (currentSec >= slides[i].startTime) {
              if (currentSlideIndex !== i) {
                goToSlide(i, false);
              }
              break;
            }
          }
        }
      }, 400);
    }

    function stopTimeTracking() {
      if (timeTrackingInterval) {
        clearInterval(timeTrackingInterval);
        timeTrackingInterval = null;
      }
    }

    function goToSlide(index, manualSeek = false) {
      if (index < 0 || index >= slides.length) return;
      currentSlideIndex = index;

      const slide = slides[index];
      const stage = document.getElementById('slide-stage');
      
      stage.style.opacity = '0';
      setTimeout(() => {
        stage.innerHTML = slide.html;
        stage.style.opacity = '1';
      }, 120);

      document.getElementById('active-cue-label').innerText = slide.cueText;
      document.getElementById('current-slide-num').innerText = index + 1;

      // Update active nav button
      slides.forEach((_, i) => {
        const pill = document.getElementById(`nav-pill-${i}`);
        if (pill) {
          if (i === index) {
            pill.className = 'px-2 py-1 text-[11px] font-bold rounded bg-amber-500 text-slate-950 transition';
          } else {
            pill.className = 'px-2 py-1 text-[11px] font-semibold rounded text-gray-400 hover:text-amber-200 transition';
          }
        }
      });
    }

    function nextSlide() {
      if (currentSlideIndex < slides.length - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    }

    function jumpVideoToSeconds(sec) {
      if (ytPlayer && ytPlayer.seekTo) {
        ytPlayer.seekTo(sec, true);
        if (ytPlayer.playVideo) ytPlayer.playVideo();
      }
    }

    function jumpToCurrentSlideVideo() {
      jumpVideoToSeconds(slides[currentSlideIndex].startTime);
    }

    function toggleAutoSync() {
      autoSyncEnabled = !autoSyncEnabled;
      const btn = document.getElementById('toggle-sync-btn');
      const txt = document.getElementById('sync-status-text');

      if (autoSyncEnabled) {
        btn.className = 'flex items-center space-x-2 text-xs font-semibold px-3 py-1.5 rounded-full border border-emerald-500/50 bg-emerald-950/60 text-emerald-300 hover:bg-emerald-900/60 transition';
        txt.innerText = 'Auto-Sync: ON';
      } else {
        btn.className = 'flex items-center space-x-2 text-xs font-semibold px-3 py-1.5 rounded-full border border-gray-600 bg-gray-900/80 text-gray-400 hover:bg-gray-800 transition';
        txt.innerText = 'Auto-Sync: OFF';
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    // Keyboard support: Left/Right arrows or PageUp/PageDown
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
    });

    // Start on load
    window.onload = () => {
      initChapterNav();
      goToSlide(0);
    };
  </script>
